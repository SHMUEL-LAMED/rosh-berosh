name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify program API and finalize R2 metadata
        run: |
          curl --fail --show-error --silent --retry 6 --retry-delay 3 \
            https://rosh-berosh.smwlyqswkwt232.workers.dev/api/program/catalog \
            --output /tmp/program-catalog.json
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/program-catalog.json', 'utf8'));
          if (!Array.isArray(data.episodes) || !data.episodes.length) {
            throw new Error('Program catalog is empty or invalid');
          }
          const r2 = data.episodes.filter((episode) => episode?.audioSource === 'r2' && episode?.r2Key).length;
          console.log(`Program catalog: ${data.episodes.length} visible episodes; ${r2} using R2`);
          if (!r2) throw new Error('No program recordings are marked as R2');
          NODE
