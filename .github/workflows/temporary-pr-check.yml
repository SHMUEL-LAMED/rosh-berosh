name: Temporary PR check

on:
  push:
    branches:
      - fix/continuous-albums-menu-prompt

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: node --check ivr-service/src/server.js
